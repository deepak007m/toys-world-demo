<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishlist | Toys World</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800;900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/src/css/global.css" />
    <link rel="stylesheet" href="/src/css/components.css" />
    <link rel="stylesheet" href="/src/css/account.css">
</head>

<body class="account-mode">
    <div id="header-placeholder"></div>

    <main class="dashboard-page">
        <div class="dashboard-container">
            <aside class="dash-sidebar reveal-left">
                <div class="dash-user">
                    <div class="dash-avatar">M</div>
                    <h3>My Account</h3>
                    <p>Manage your profile</p>
                </div>
                <ul class="dash-menu account-menu">
                    <li><a href="/account.html">My Account / Profile</a></li>
                    <li><a href="/orders.html">My Orders</a></li>
                    <li><a href="/orders.html">Order Status</a></li>
                    <li><a href="/wishlist.html" class="active">Wishlist</a></li>
                    <li><a href="/account.html#addresses">Saved Addresses</a></li>
                    <li><a href="/account.html#password">Change Password</a></li>
                    <li><button id="signout-btn" style="color: #ef4444;">Sign Out</button></li>
                </ul>
            </aside>

            <section class="dash-content reveal">
                <div class="dash-heading-wrap">
                    <h1 class="dash-title">Your Wishlist</h1>
                    <p class="dash-subtitle">Items you're keeping an eye on.</p>
                </div>

                <div class="grid-3 stagger" id="wishlist-grid" style="display:none;"></div>

                <div class="empty-state" id="empty-wishlist" style="display: none;">
                    <div class="empty-state-icon">❤️</div>
                    <h3>Wishlist is empty</h3>
                    <p>You haven't saved any items yet. Start exploring!</p>
                    <button class="btn btn-outline" style="border-color: #D1D5DB; color: #111827;"
                        onclick="window.location.href='/shop.html'">Discover Toys</button>
                </div>
            </section>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module">
        import { getConfig, getWishlistItems } from '/src/js/data.js';
        import { renderHeader, renderFooter, wireNavDrawer, wireScrollReveal, mountAuthListener, wireStoreActions, renderProductCard } from '/src/js/components.js';
        import { supabase } from '/src/js/supabase.js';

        async function renderWishlist() {
            const { data: sessionData } = await supabase.auth.getSession();
            if (!sessionData?.session) {
                window.location.href = '/login.html?redirect=/wishlist.html';
                return;
            }

            const { data, error } = await getWishlistItems();
            const grid = document.getElementById('wishlist-grid');
            const emptyState = document.getElementById('empty-wishlist');

            if (error || !data || data.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'flex';
                return;
            }

            grid.style.display = 'grid';
            emptyState.style.display = 'none';

            grid.innerHTML = data.map(item => {
                let product = item.products;
                if (Array.isArray(product)) product = product[0];
                if (!product) return ''; // handles gracefully missing products
                return renderProductCard(product, '', true);
            }).join('');
        }

        async function init() {
            const config = await getConfig();
            document.getElementById('header-placeholder').innerHTML = renderHeader('Wishlist', config);
            document.getElementById('footer-placeholder').innerHTML = renderFooter(config);

            mountAuthListener(supabase);
            wireStoreActions(supabase);
            await renderWishlist();

            document.getElementById('signout-btn')?.addEventListener('click', async () => {
                await supabase.auth.signOut();
                window.location.href = '/login.html';
            });

            // Card removal after wishlist DELETE is handled in wireStoreActions (success-only).

            wireNavDrawer();
            wireScrollReveal();
        }
        init();
    </script>
</body>

</html>
