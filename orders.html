<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders | Toys World</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800;900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/src/css/global.css" />
    <link rel="stylesheet" href="/src/css/components.css" />
    <link rel="stylesheet" href="/src/css/account.css" />
    <style>
        .orders-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .orders-state h2 {
            color: #111827;
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .orders-state p {
            color: #6B7280;
            margin-bottom: 1.5rem;
        }

        .orders-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 12px;
            color: #991B1B;
            padding: 1.25rem;
        }

        .order-status-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .order-status-badge {
            display: inline-flex;
            align-items: center;
            border-radius: 9999px;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.35rem 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .order-status-badge.order-status {
            background: rgba(59, 130, 246, 0.1);
            color: #1D4ED8;
        }

        .order-status-badge.payment-status {
            background: rgba(232, 184, 75, 0.16);
            color: #8A650C;
        }

        .order-summary-text {
            color: #6B7280;
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        .order-details-panel {
            border-top: 1px solid #E5E7EB;
            padding: 2rem;
        }

        .order-details-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.4fr) minmax(220px, 1fr);
            gap: 2rem;
        }

        .order-detail-section h3 {
            color: #111827;
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        .order-item-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .order-history-item {
            align-items: center;
            display: flex;
            gap: 1rem;
        }

        .order-history-item img,
        .order-history-item-placeholder {
            background: #F3F4F6;
            border: 1px solid #E5E7EB;
            border-radius: 10px;
            flex: 0 0 64px;
            height: 64px;
            object-fit: cover;
            width: 64px;
        }

        .order-history-item-placeholder {
            align-items: center;
            color: #9CA3AF;
            display: flex;
            font-size: 1.4rem;
            justify-content: center;
        }

        .order-history-item-info {
            flex: 1;
            min-width: 0;
        }

        .order-history-item-info h4 {
            color: #111827;
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
        }

        .order-history-item-info p,
        .order-address,
        .order-price-row {
            color: #6B7280;
            font-size: 0.85rem;
        }

        .order-price-summary,
        .order-address {
            background: #F9FAFB;
            border-radius: 12px;
            padding: 1rem;
        }

        .order-price-row {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.55rem;
        }

        .order-price-row.total {
            border-top: 1px solid #E5E7EB;
            color: #111827;
            font-weight: 800;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
        }

        .order-address {
            line-height: 1.6;
            white-space: pre-line;
        }

        .order-address strong {
            color: #111827;
        }

        .orders-loading-card {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 20px;
            color: #6B7280;
            padding: 3rem;
            text-align: center;
        }

        @media (max-width: 700px) {
            .order-details-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .order-details-panel,
            .order-body-light {
                padding: 1.25rem;
            }

            .order-header-light {
                padding: 1.25rem;
            }
        }
    </style>
</head>

<body class="account-mode" style="--header-h: 70px;">
    <div id="header-placeholder"></div>

    <main class="dashboard-page">
        <div class="dashboard-container">
            <aside class="dash-sidebar reveal-left">
                <div class="dash-user">
                    <div class="dash-avatar">M</div>
                    <h3>My Account</h3>
                    <p>Manage your profile</p>
                </div>
                <ul class="dash-menu account-menu">
                    <li><a href="/account.html">My Account / Profile</a></li>
                    <li><a href="/orders.html" class="active">My Orders</a></li>
                    <li><a href="/orders.html" class="active">Order Status</a></li>
                    <li><a href="/wishlist.html">Wishlist</a></li>
                    <li><a href="/account.html#addresses">Saved Addresses</a></li>
                    <li><a href="/account.html#password">Change Password</a></li>
                    <li><button id="signout-btn" style="color: #ef4444;">Sign Out</button></li>
                </ul>
            </aside>

            <section class="dash-content reveal">
                <div class="dash-heading-wrap">
                    <h1 class="dash-title">My Orders</h1>
                    <p class="dash-subtitle">View your purchases and order details.</p>
                </div>
                <div id="orders-content" aria-live="polite">
                    <div class="orders-loading-card">Loading your orders...</div>
                </div>
            </section>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="/src/js/pages/orders.js"></script>
</body>

</html>
