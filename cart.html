<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart | Toys World</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800;900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/src/css/global.css" />
    <link rel="stylesheet" href="/src/css/components.css" />
    <style>
        .page-header {
            background: var(--bg-secondary);
            padding: 6rem 0 3rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .page-title {
            font-family: var(--font-heading);
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 900;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .cart-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 3rem;
            align-items: start;
            margin-top: 3rem;
            margin-bottom: 6rem;
        }

        @media (max-width: 900px) {
            .cart-grid {
                grid-template-columns: 1fr;
            }
        }

        .cart-item {
            display: flex;
            gap: 1.5rem;
            padding: 1.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .cart-item-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: var(--radius-md);
            background: var(--bg-elevated);
        }

        .cart-item-details {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .cart-item-brand {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            margin-bottom: 0.25rem;
        }

        .cart-item-name {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .cart-item-price {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-gold);
        }

        .qty-control {
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-sm);
            width: fit-content;
            margin-top: 1rem;
        }

        .qty-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .qty-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .qty-input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            width: 40px;
            text-align: center;
            font-weight: 700;
            font-size: 1rem;
        }

        .cart-item-remove {
            margin-top: auto;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: underline;
            cursor: pointer;
            align-self: flex-start;
            margin-top: 1.25rem;
            padding: 0.5rem;
            margin-left: -0.5rem;
            border: none;
            background: transparent;
        }

        .summary-card {
            background: var(--bg-elevated);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-lg);
            padding: 2rem;
            position: sticky;
            top: 100px;
        }

        .summary-title {
            font-family: var(--font-heading);
            font-size: 1.25rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 1rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .summary-row.total {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 1rem;
            margin-top: 1rem;
            margin-bottom: 2rem;
        }
    </style>
</head>

<body>
    <div id="header-placeholder"></div>

    <main>
        <div class="page-header">
            <div class="container reveal">
                <h1 class="page-title">Your Cart</h1>
                <p style="color:var(--text-secondary);" id="cart-subtitle">Loading...</p>
            </div>
        </div>

        <div class="container reveal reveal-delay-1">
            <div class="cart-grid" id="cart-container" style="display:none;">
                <!-- Cart Items (Dynamic) -->
                <div class="cart-items-list" id="cart-list"></div>

                <!-- Order Summary -->
                <div>
                    <div class="summary-card">
                        <h2 class="summary-title">Order Summary</h2>
                        <div class="summary-row">
                            <span id="summary-items-count">Subtotal (0 items)</span>
                            <span id="summary-subtotal">₹0</span>
                        </div>
                        <div class="summary-row">
                            <span>Standard Shipping</span>
                            <span>Calculated at checkout</span>
                        </div>
                        <div class="summary-row total">
                            <span>Estimated Total</span>
                            <span id="summary-total">₹0</span>
                        </div>
                        <a href="/checkout.html" class="btn btn-gold"
                            style="width:100%; padding:1rem; font-size:1.1rem; justify-content:center;">Proceed to
                            Checkout</a>
                        <p style="text-align:center; margin-top:1.5rem; font-size:0.8rem; color:var(--text-muted);">
                            By checking out, you agree to our <a href="/terms.html"
                                style="color:var(--text-muted);">Terms of Service</a>.
                        </p>
                    </div>
                </div>
            </div>

            <div id="cart-empty" style="display:none; text-align:center; padding:5rem 0;">
                <h2
                    style="font-family:var(--font-heading); font-size:2rem; font-weight:800; margin-bottom:1rem; text-transform:uppercase;">
                    Your cart is empty</h2>
                <p style="color:var(--text-muted); margin-bottom:2rem;">Looks like you haven't added anything yet.</p>
                <a href="/shop.html" class="btn btn-gold">Continue Shopping</a>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module">
        import { getConfig, getCartItems, updateCartQuantity, removeCartItem } from '/src/js/data.js';
        import { renderHeader, renderFooter, wireNavDrawer, wireScrollReveal, mountAuthListener, refreshBadges } from '/src/js/components.js';
        import { supabase } from '/src/js/supabase.js';

        async function renderCart() {
            const { data: sessionData } = await supabase.auth.getSession();
            if (!sessionData?.session) {
                window.location.href = '/login.html?redirect=/cart.html';
                return;
            }

            const { data, error } = await getCartItems();
            const container = document.getElementById('cart-container');
            const emptyState = document.getElementById('cart-empty');

            if (error || !data || data.length === 0) {
                container.style.display = 'none';
                emptyState.style.display = 'block';
                document.getElementById('cart-subtitle').textContent = '0 items pending.';
                refreshBadges(supabase, sessionData.session.user.id);
                return;
            }

            container.style.display = 'grid';
            emptyState.style.display = 'none';

            const listEl = document.getElementById('cart-list');
            let subtotal = 0;
            let totalItems = 0;

            listEl.innerHTML = data.map(item => {
                let product = item.products;
                if (Array.isArray(product)) product = product[0];
                if (!product) return '';

                const itemTotal = (product.price || 0) * item.quantity;
                subtotal += itemTotal;
                totalItems += item.quantity;

                return `
                    <div class="cart-item" data-id="${product.id}">
                        ${product.image_url
                        ? `<img src="${product.image_url}" alt="${product.name}" class="cart-item-img" />`
                        : `<div class="cart-item-img" style="background:#222;"></div>`}
                        <div class="cart-item-details">
                            <span class="cart-item-brand">Item</span>
                            <a href="/product.html?id=${product.id}" class="cart-item-name" style="color:var(--text-primary); text-decoration:none;">${product.name}</a>
                            <span class="cart-item-price">₹${(product.price || 0).toLocaleString('en-IN')}</span>
                            <div class="qty-control">
                                <button type="button" class="qty-btn btn-minus" data-id="${product.id}" data-qty="${item.quantity}">-</button>
                                <input type="text" class="qty-input" value="${item.quantity}" readonly>
                                <button type="button" class="qty-btn btn-plus" data-id="${product.id}" data-qty="${item.quantity}">+</button>
                            </div>
                            <button type="button" class="cart-item-remove btn-remove" data-id="${product.id}">Remove</button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('cart-subtitle').textContent = `${totalItems} item${totalItems !== 1 ? 's' : ''} pending. Ready to roll.`;
            document.getElementById('summary-items-count').textContent = `Subtotal (${totalItems} item${totalItems !== 1 ? 's' : ''})`;
            const formattedTotal = `₹${subtotal.toLocaleString('en-IN')}`;
            document.getElementById('summary-subtotal').textContent = formattedTotal;
            document.getElementById('summary-total').textContent = formattedTotal;

            refreshBadges(supabase, sessionData.session.user.id);
        }

        async function handleCartAction(e) {
            const btnPlus = e.target.closest('.btn-plus');
            const btnMinus = e.target.closest('.btn-minus');
            const btnRemove = e.target.closest('.btn-remove');

            if (!btnPlus && !btnMinus && !btnRemove) return;

            e.preventDefault();
            e.stopPropagation();

            const btn = btnPlus || btnMinus || btnRemove;
            const productId = btn.dataset.id;
            const currentQty = parseInt(btn.dataset.qty, 10) || 1;

            if (!productId || productId === 'undefined') {
                alert('Error: Could not determine product ID. Please reload the page.');
                return;
            }

            const { data: sesData } = await supabase.auth.getSession();
            if (!sesData?.session?.user?.id) {
                window.location.href = '/login.html?redirect=/cart.html';
                return;
            }

            const parentItem = btn.closest('.cart-item');
            if (parentItem) {
                parentItem.style.opacity = '0.5';
                parentItem.style.pointerEvents = 'none';
            }

            let res;
            if (btnPlus) {
                res = await updateCartQuantity(productId, currentQty + 1);
            } else if (btnMinus) {
                if (currentQty <= 1) {
                    if (parentItem) { parentItem.style.opacity = '1'; parentItem.style.pointerEvents = ''; }
                    return;
                }
                res = await updateCartQuantity(productId, currentQty - 1);
            } else {
                res = await removeCartItem(productId);
            }

            if (res?.error) {
                const errMsg = res.error?.message || (typeof res.error === 'string' ? res.error : JSON.stringify(res.error));
                console.error('[Cart] Mutation ERROR:', res.error);
                alert('Error: ' + errMsg);
                if (parentItem) { parentItem.style.opacity = '1'; parentItem.style.pointerEvents = ''; }
                return;
            }

            await renderCart();
        }

        async function init() {
            const config = await getConfig();
            document.getElementById('header-placeholder').innerHTML = renderHeader('Cart', config);
            document.getElementById('footer-placeholder').innerHTML = renderFooter(config);

            mountAuthListener(supabase);
            await renderCart();
            document.getElementById('cart-list')?.addEventListener('click', handleCartAction);

            wireNavDrawer();
            wireScrollReveal();
        }
        init();
    </script>
</body>

</html>
