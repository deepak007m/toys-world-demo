<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Toys World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/src/css/global.css">
    <link rel="stylesheet" href="/src/css/components.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% -20%, rgba(232, 184, 75, 0.15), var(--bg-primary) 60%);
            padding: 6rem 1.5rem;
        }

        .auth-box {
            max-width: 440px;
            width: 100%;
            padding: 3.5rem 2.5rem;
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .auth-title {
            font-family: var(--font-heading);
            font-size: 2.25rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: #fff;
        }

        .auth-sub {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            text-align: left;
        }

        .form-group label {
            font-family: var(--font-heading);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 700;
        }

        .form-group input {
            background: var(--bg-surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            padding: 0.875rem 1rem;
            color: #fff;
            transition: all 0.2s;
            font-family: var(--font-sans);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(232, 184, 75, 0.15);
        }

        .status-msg {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .status-msg.success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.2);
        }

        .auth-links {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .auth-links a {
            color: var(--accent-gold);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }

        .auth-links a:hover {
            color: #fff;
        }
    </style>
</head>

<body>
    <div id="header-root"></div>

    <main class="auth-container">
        <a href="/" class="logo" style="margin-bottom:2rem; font-size:1.75rem; color:#fff;">TOYS WORLD<span
                class="logo-dot"></span></a>

        <div class="auth-box reveal-up">
            <h1 class="auth-title">Forgot Password</h1>
            <p class="auth-sub">Enter your email and we'll send you a recovery link.</p>

            <div id="status-msg" class="status-msg"></div>

            <form id="reset-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>
                <button type="submit" id="submit-btn" class="btn btn-gold"
                    style="width: 100%; padding:1rem; font-size:1.05rem; margin-top:1rem;">Send Link</button>
            </form>

            <div class="auth-links">
                <div>Remembered? <a href="/login.html">Sign In</a></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { supabase } from '/src/js/supabase.js';

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const msg = document.getElementById('status-msg');
            const email = document.getElementById('email').value;

            btn.disabled = true;
            btn.textContent = 'Sending...';
            msg.style.display = 'none';
            msg.className = 'status-msg';

            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: `${window.location.origin}/account.html`,
            });

            if (error) {
                msg.textContent = error.message;
                msg.classList.add('error');
            } else {
                msg.textContent = 'Check your email for the reset link!';
                msg.classList.add('success');
            }
            msg.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Send Link';
        });
    </script>
</body>

</html>
