<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Toys World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/src/css/global.css">
    <link rel="stylesheet" href="/src/css/components.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: var(--header-h);
        }

        .auth-box {
            max-width: 420px;
            margin: 4rem auto;
            padding: 3rem 2rem;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            width: 100%;
        }

        .auth-title {
            font-family: var(--font-heading);
            font-size: 2rem;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 0.5rem;
            color: var(--accent-gold);
        }

        .auth-subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-family: var(--font-heading);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .form-group input {
            background: var(--bg-elevated);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            padding: 0.8rem;
            color: var(--text-primary);
            transition: all var(--t-fast);
            font-family: var(--font-body);
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 2px rgba(232, 184, 75, 0.2);
        }

        .auth-error {
            background: rgba(239, 68, 68, 0.15);
            color: #FCA5A5;
            padding: 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .auth-success {
            background: rgba(16, 185, 129, 0.15);
            color: #6EE7B7;
            padding: 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: none;
            border: 1px solid rgba(16, 185, 129, 0.3);
            text-align: center;
        }

        .auth-links {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .auth-links a {
            color: var(--text-primary);
            text-decoration: underline;
            text-underline-offset: 4px;
            transition: color var(--t-fast);
        }
    </style>
</head>

<body>
    <div id="header-root"></div>
    <main class="auth-container">
        <div class="auth-box reveal-up">
            <h1 class="auth-title">Reset Password</h1>
            <p class="auth-subtitle">Enter your email address to receive a secure reset link.</p>

            <div id="auth-error-box" class="auth-error"></div>
            <div id="auth-success-box" class="auth-success">
                <div style="font-size: 2rem; margin-bottom: 0.5rem">✉️</div>
                <strong>Link Sent!</strong><br>Check your email for the password reset link.<br><br>
                <a href="/login.html" class="btn btn-outline" style="font-size: 0.8rem">Return to Login</a>
            </div>

            <form id="forgot-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary"
                    style="width: 100%; display: flex; justify-content: center; height: 50px;">Send Reset Link</button>
            </form>

            <div class="auth-links" id="login-link-container">
                Remembered your password? <a href="/login.html">Sign In</a>
            </div>
        </div>
    </main>
    <script type="module" src="/src/js/main.js"></script>
    <script type="module" src="/src/js/pages/forgot-password.js"></script>
</body>

</html>
