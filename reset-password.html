<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password — Toys World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/src/css/global.css">
    <link rel="stylesheet" href="/src/css/components.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% -20%, rgba(232, 184, 75, 0.15), var(--bg-primary) 60%);
            padding: 6rem 1.5rem;
        }

        .auth-box {
            max-width: 440px;
            width: 100%;
            padding: 3.5rem 2.5rem;
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .auth-title {
            font-family: var(--font-heading);
            font-size: 2.25rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: #fff;
        }

        .auth-sub {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            text-align: left;
        }

        .form-group label {
            font-family: var(--font-heading);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 700;
        }

        .form-group input {
            background: var(--bg-surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            padding: 0.875rem 1rem;
            color: #fff;
            transition: all 0.2s;
            font-family: var(--font-sans);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(232, 184, 75, 0.15);
        }

        .auth-error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .auth-success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            padding: 1.5rem;
            border-radius: var(--radius-sm);
            margin: 1.5rem 0;
            font-size: 0.95rem;
            display: none;
            border: 1px solid rgba(16, 185, 129, 0.2);
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div id="header-root"></div>

    <main class="auth-container">
        <a href="/" class="logo" style="margin-bottom:2rem; font-size:1.75rem; color:#fff;">TOYS WORLD<span
                class="logo-dot"></span></a>

        <div class="auth-box">
            <h1 class="auth-title">New Password</h1>
            <p class="auth-sub">Secure your account.</p>

            <div id="auth-error-box" class="auth-error"></div>
            <div id="auth-success-box" class="auth-success">
                <strong>Password updated successfully!</strong><br><br>
                Redirecting you to login...
            </div>

            <form id="reset-form">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" required minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" id="submit-btn" class="btn btn-gold"
                    style="width: 100%; padding:1rem; font-size:1.05rem; margin-top:1rem;">Save Password</button>
            </form>
        </div>
    </main>

    <script type="module" src="/src/js/main.js"></script>
    <script type="module" src="/src/js/pages/reset-password.js"></script>
</body>

</html>
