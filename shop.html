<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop — Toys World & Gift Gallery</title>
    <meta name="description"
        content="Browse our full collection of toys, anime figures, die-cast cars, RC toys, plush, and collectibles at Toys World Palghar." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800;900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/src/css/global.css" />
    <link rel="stylesheet" href="/src/css/components.css" />
    <link rel="stylesheet" href="/src/css/shop.css" />
</head>

<body>
    <div id="header-placeholder"></div>

    <div class="shop-hero">
        <div class="container">
            <p class="label" style="margin-bottom:0.75rem;">Browse Everything</p>
            <h1 class="shop-title">Shop<br /><span style="color:var(--accent-gold);">Collection</span></h1>
            <p class="shop-sub">Anime · Die-Cast · Figures · RC · Plush · Gifts</p>
        </div>
    </div>

    <!-- Category filter chips -->
    <div class="filter-bar">
        <div class="container"
            style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
            <div style="display:flex; align-items:center; gap:1rem;">
                <div style="font-size:0.8rem; color:var(--text-muted); font-weight:600;"><a href="/"
                        style="color:inherit; text-decoration:none;">Home</a> <span style="margin:0 0.25rem;">/</span>
                    <span style="color:var(--text-primary);">Shop</span></div>
                <div class="filter-scroll" id="filters"
                    style="border-left:1px solid rgba(255,255,255,0.1); padding-left:1rem; margin-left:0.5rem;"></div>
            </div>
            <div style="display:flex; align-items:center; gap:0.5rem;">
                <input type="text" placeholder="Search..."
                    style="background:var(--bg-elevated); border:1px solid rgba(255,255,255,0.1); border-radius:var(--radius-sm); color:#fff; padding:0.5rem 1rem; font-size:0.85rem; outline:none;">
                <select
                    style="background:var(--bg-elevated); border:1px solid rgba(255,255,255,0.1); border-radius:var(--radius-sm); color:#fff; padding:0.5rem; font-size:0.85rem; outline:none; font-weight:600;">
                    <option>Sort: Featured</option>
                    <option>Price: Low to High</option>
                    <option>Price: High to Low</option>
                    <option>Newest Arrivals</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Subcategory pill row (shown dynamically) -->
    <div class="subfilter-bar" id="subfilter-bar">
        <div class="container">
            <div class="subfilter-scroll" id="subfilters"></div>
        </div>
    </div>

    <div class="shop-grid-wrap">
        <div class="container">
            <div class="grid-4" id="shop-grid"></div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script type="module" src="/src/js/pages/shop.js"></script>
</body>

</html>
