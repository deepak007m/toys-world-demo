<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop — Toys World & Gift Gallery</title>
    <meta name="description"
        content="Browse our full collection of toys, anime figures, die-cast cars, RC toys, plush, and collectibles at Toys World Palghar." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800;900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/src/css/global.css" />
    <link rel="stylesheet" href="/src/css/components.css" />

    <style>
        /* ── Shop Hero ────────────────────────────────────── */
        .shop-hero {
            background: var(--bg-secondary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: calc(var(--header-h) + 3.5rem) 0 3rem;
        }

        .shop-title {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 900;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            line-height: 1.0;
        }

        .shop-sub {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-family: var(--font-heading);
            font-weight: 600;
        }

        /* ── Filter Bar ───────────────────────────────────── */
        .filter-bar {
            padding: 1rem 0;
            background: var(--bg-primary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: var(--header-h);
            z-index: 40;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .filter-scroll {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding-bottom: 2px;
        }

        .filter-scroll::-webkit-scrollbar {
            display: none;
        }

        .filter-chip {
            flex-shrink: 0;
            padding: 0.5rem 1.2rem;
            border-radius: 9999px;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            white-space: nowrap;
            background: var(--bg-elevated);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: all var(--t-fast);
        }

        .filter-chip:hover {
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .filter-chip.active {
            background: var(--accent-gold);
            color: #0D0D0F;
            border-color: var(--accent-gold);
            box-shadow: 0 0 16px var(--accent-gold-glow);
        }

        /* ── Subcategory pill row ─────────────────────────── */
        .subfilter-bar {
            padding: 0.65rem 0;
            background: var(--bg-secondary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            position: sticky;
            top: calc(var(--header-h) + 54px);
            z-index: 39;
            display: none;
        }

        .subfilter-bar.visible {
            display: block;
        }

        .subfilter-scroll {
            display: flex;
            gap: 0.4rem;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding-bottom: 2px;
        }

        .subfilter-scroll::-webkit-scrollbar {
            display: none;
        }

        .subfilter-chip {
            flex-shrink: 0;
            padding: 0.35rem 0.9rem;
            border-radius: 9999px;
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            white-space: nowrap;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: all var(--t-fast);
        }

        .subfilter-chip:hover {
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .subfilter-chip.active {
            background: rgba(232, 184, 75, 0.15);
            color: var(--accent-gold);
            border-color: rgba(232, 184, 75, 0.35);
        }

        /* ── Grid area ────────────────────────────────────── */
        .shop-grid-wrap {
            padding: 3rem 0 5rem;
        }

        /* ── Empty / Error states ─────────────────────────── */
        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 1rem;
            color: var(--text-secondary);
        }

        .empty-msg h3 {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .empty-msg p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .error-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: var(--radius-md);
            font-size: 0.92rem;
        }
    </style>
</head>

<body>
    <div id="header-placeholder"></div>

    <div class="shop-hero">
        <div class="container">
            <p class="label" style="margin-bottom:0.75rem;">Browse Everything</p>
            <h1 class="shop-title">Shop<br /><span style="color:var(--accent-gold);">Collection</span></h1>
            <p class="shop-sub">Anime · Die-Cast · Figures · RC · Plush · Gifts</p>
        </div>
    </div>

    <!-- Category filter chips -->
    <div class="filter-bar">
        <div class="container">
            <div class="filter-scroll" id="filters"></div>
        </div>
    </div>

    <!-- Subcategory pill row (shown dynamically) -->
    <div class="subfilter-bar" id="subfilter-bar">
        <div class="container">
            <div class="subfilter-scroll" id="subfilters"></div>
        </div>
    </div>

    <div class="shop-grid-wrap">
        <div class="container">
            <div class="grid-4" id="shop-grid"></div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script type="module">
        import {
            getConfig, getCategories, getSubcategories, getProducts, buildWhatsAppLink
        } from '/src/js/data.js';
        import {
            renderHeader, renderFooter, renderProductCard,
            wireNavDrawer, wireScrollReveal, skeletonProductCards
        } from '/src/js/components.js';

        // ── State ────────────────────────────────────────────
        let currentCategoryId = null;
        let currentCategorySlug = 'all';
        let currentSubcatId = null;
        let waNumber = '';
        let allCategories = [];

        // ── Skeleton ──────────────────────────────────────────
        document.getElementById('shop-grid').innerHTML = skeletonProductCards(8);

        // ── Transparent → solid header on scroll ─────────────
        window.addEventListener('scroll', () => {
            document.querySelector('.header')?.classList.toggle('scrolled', window.scrollY > 20);
        }, { passive: true });

        // ── Initial fetch ─────────────────────────────────────
        const [config, categories] = await Promise.all([getConfig(), getCategories()]);

        waNumber = config?.whatsapp_number || '';
        allCategories = categories;

        document.getElementById('header-placeholder').innerHTML = renderHeader('Shop', config);
        document.getElementById('footer-placeholder').innerHTML = renderFooter(config);
        wireNavDrawer();

        // Re-attach scroll on new header
        window.addEventListener('scroll', () => {
            document.querySelector('.header')?.classList.toggle('scrolled', window.scrollY > 20);
        }, { passive: true });
        document.querySelector('.header')?.classList.add('scrolled');

        // ── Read category from URL ────────────────────────────
        const urlParams = new URLSearchParams(window.location.search);
        const slugFromUrl = urlParams.get('category') || 'all';
        const matchedCat = categories.find(c => c.slug === slugFromUrl);

        if (matchedCat) {
            currentCategoryId = matchedCat.id;
            currentCategorySlug = matchedCat.slug;
        }

        // ── Render category chips ─────────────────────────────
        function renderFilterChips() {
            const filtersEl = document.getElementById('filters');
            const chips = [{ id: null, slug: 'all', title: 'All' }, ...allCategories];
            filtersEl.innerHTML = chips.map(c => `
                <button class="filter-chip${currentCategorySlug === c.slug ? ' active' : ''}"
                        data-id="${c.id || ''}" data-slug="${c.slug}">
                    ${c.title}
                </button>
            `).join('');
        }

        // ── Render subcategory pills ──────────────────────────
        async function renderSubfilterBar(categoryId) {
            const bar = document.getElementById('subfilter-bar');
            const el = document.getElementById('subfilters');
            if (!categoryId) { bar.classList.remove('visible'); el.innerHTML = ''; return; }

            const subcats = await getSubcategories(categoryId);
            if (!subcats.length) { bar.classList.remove('visible'); el.innerHTML = ''; return; }

            bar.classList.add('visible');
            el.innerHTML = [
                `<button class="subfilter-chip${!currentSubcatId ? ' active' : ''}" data-id="">All</button>`,
                ...subcats.map(s =>
                    `<button class="subfilter-chip${currentSubcatId === s.id ? ' active' : ''}" data-id="${s.id}">${s.title}</button>`
                )
            ].join('');
        }

        // ── Render product grid ───────────────────────────────
        async function renderProducts() {
            const gridEl = document.getElementById('shop-grid');
            gridEl.innerHTML = skeletonProductCards(8);

            const products = await getProducts({
                categoryId: currentCategoryId || undefined,
                subcategoryId: currentSubcatId || undefined,
            });

            if (!products.length) {
                const waBaseLink = waNumber ? buildWhatsAppLink(waNumber) : '#';
                gridEl.innerHTML = `
                    <div class="empty-msg">
                        <h3>No Products Yet</h3>
                        <p>We're stocking up — visit us in store or ask on WhatsApp!</p>
                        <a href="${waBaseLink}" target="_blank" rel="noopener" class="btn btn-whatsapp">
                            💬 Ask on WhatsApp
                        </a>
                    </div>`;
                return;
            }

            gridEl.innerHTML = products.map(p => renderProductCard(p, waNumber)).join('');
        }

        // ── Category chip click ───────────────────────────────
        document.getElementById('filters').addEventListener('click', async e => {
            const btn = e.target.closest('.filter-chip');
            if (!btn) return;
            currentCategoryId = btn.dataset.id || null;
            currentCategorySlug = btn.dataset.slug;
            currentSubcatId = null;

            const u = new URL(window.location.href);
            currentCategorySlug === 'all' ? u.searchParams.delete('category') : u.searchParams.set('category', currentCategorySlug);
            history.pushState({}, '', u);

            renderFilterChips();
            await renderSubfilterBar(currentCategoryId);
            await renderProducts();
        });

        // ── Subcategory pill click ────────────────────────────
        document.getElementById('subfilter-bar').addEventListener('click', async e => {
            const btn = e.target.closest('.subfilter-chip');
            if (!btn) return;
            currentSubcatId = btn.dataset.id || null;
            document.querySelectorAll('.subfilter-chip').forEach(c => {
                c.classList.toggle('active', c.dataset.id === (currentSubcatId || ''));
            });
            await renderProducts();
        });

        // ── Initial render ────────────────────────────────────
        renderFilterChips();
        await renderSubfilterBar(currentCategoryId);
        await renderProducts();
        wireScrollReveal();
    </script>
</body>

</html>
