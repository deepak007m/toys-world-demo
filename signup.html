<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Toys World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/src/css/global.css">
    <link rel="stylesheet" href="/src/css/components.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% -20%, rgba(232, 184, 75, 0.15), var(--bg-primary) 60%);
            padding: 6rem 1.5rem;
        }

        .auth-box {
            max-width: 440px;
            width: 100%;
            padding: 3.5rem 2.5rem;
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .auth-title {
            font-family: var(--font-heading);
            font-size: 2.25rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: #fff;
        }

        .auth-sub {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            text-align: left;
        }

        .form-group label {
            font-family: var(--font-heading);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 700;
        }

        .form-group input {
            background: var(--bg-surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            padding: 0.875rem 1rem;
            color: #fff;
            transition: all 0.2s;
            font-family: var(--font-sans);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(232, 184, 75, 0.15);
        }

        .auth-error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .auth-success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            padding: 1.5rem;
            border-radius: var(--radius-sm);
            margin: 1.5rem 0;
            font-size: 0.95rem;
            display: none;
            border: 1px solid rgba(16, 185, 129, 0.2);
            text-align: center;
            line-height: 1.5;
        }

        .auth-links {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .auth-links a {
            color: var(--accent-gold);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }

        .auth-links a:hover {
            color: #fff;
        }
    </style>
</head>

<body>
    <div id="header-root"></div>

    <main class="auth-container">
        <a href="/" class="logo" style="margin-bottom:2rem; font-size:1.75rem; color:#fff;">TOYS WORLD<span
                class="logo-dot"></span></a>

        <div class="auth-box">
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-sub">Join the coolest collector community.</p>

            <button id="google-btn" class="btn btn-outline"
                style="width:100%; margin-bottom:1.5rem; display:flex; justify-content:center; align-items:center; gap:0.75rem; border-color:rgba(255,255,255,0.1);">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4" />
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853" />
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        fill="#FBBC05" />
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        fill="#EA4335" />
                </svg>
                Continue with Google
            </button>

            <div
                style="display:flex; align-items:center; text-align:center; color:var(--text-muted); margin-bottom:1.5rem;">
                <div style="flex:1; height:1px; background:rgba(255,255,255,0.06);"></div>
                <span
                    style="padding:0 1rem; font-size:0.75rem; text-transform:uppercase; font-weight:700; letter-spacing:0.1em;">OR
                    WITH EMAIL</span>
                <div style="flex:1; height:1px; background:rgba(255,255,255,0.06);"></div>
            </div>

            <div id="auth-error-box" class="auth-error"></div>
            <div id="auth-success-box" class="auth-success">
                <strong>Account created successfully!</strong><br><br>
                Please check your email for a confirmation link to activate your account.
                Go back to <a href="/login.html" style="color: #6EE7B7; text-decoration:underline;">Login</a>.
            </div>

            <form id="signup-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" required minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" id="submit-btn" class="btn btn-gold"
                    style="width: 100%; padding:1rem; font-size:1.05rem; margin-top:1rem;">Create Account</button>
            </form>

            <div class="auth-links" id="login-link-container">
                <div style="color:var(--text-secondary);">
                    Already have an account? <a href="/login.html">Sign In</a>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="/src/js/main.js"></script>
    <script type="module" src="/src/js/pages/signup.js"></script>
</body>

</html>
